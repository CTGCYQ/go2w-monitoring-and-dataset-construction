# Serve the existing host clock; chronyd -x never changes it.
# Host systemd-timesyncd must remain synchronized to its upstream.
bindaddress 192.168.123.222
port 123
cmdport 0
allow 192.168.123.18/32
local stratum 8
pidfile /run/go2w-time/chronyd.pid
driftfile /home/dell/go2w_gaussian/logs/ntp-drift
logdir /home/dell/go2w_gaussian/logs
